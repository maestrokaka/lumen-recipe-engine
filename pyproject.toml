[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen-recipe-engine"
version = "0.1.0"
description = "Bounded declarative RGB animation compilation and pixel quality inspection"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "maestrokaka"}]
keywords = ["rgb", "led", "animation", "json", "lighting"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]
dependencies = []

[project.optional-dependencies]
test = ["jsonschema>=4.23,<5"]

[project.scripts]
lumen-recipe = "lumen_recipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lumen_recipe = ["cyberboard.json"]
